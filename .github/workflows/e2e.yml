name: e2e
run-name: ${{ inputs.qahub_run_id && format('e2e · QA Hub {0}', inputs.qahub_run_id) || 'e2e' }}

on:
  workflow_dispatch:
    inputs:
      qahub_run_id: { type: string, default: '' }
      qahub_grep: { type: string, default: '' }
      qahub_keys: { type: string, default: '' }
      qahub_env: { type: string, default: '' }
      qahub_selection: { type: string, default: '' }
      qahub_projects: { type: string, default: '' }
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      QAHUB_URL: ${{ secrets.QAHUB_URL }}
      QAHUB_TOKEN: ${{ secrets.QAHUB_TOKEN }}
      QAHUB_RUN_ID: ${{ inputs.qahub_run_id }}
      QAHUB_KEYS: ${{ inputs.qahub_keys }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Tests
        run: |
          if [ -n "$QAHUB_KEYS" ]; then
            npx playwright test --grep "$QAHUB_KEYS"
          else
            npx playwright test
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
